<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arnaque ou pas ?</title>
<style>
  /* Même famille que les autres projets : sable, terre cuite, phrases simples. */
  :root {
    --fond: #f6efe4; --carte: #fffaf3; --texte: #3a2e26; --doux: #8a7769; --trait: #eadfce;
    --accent: #d9693a; --accent-pale: #f6dccb; --soleil: #e6a23c; --soleil-pale: #fbe7c4;
    --mer: #2f7d78; --mer-pale: #d5ece9;
    --ombre: 0 1px 2px rgba(90,60,30,.06), 0 8px 24px rgba(90,60,30,.07); color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #1f1a17; --carte: #2a2420; --texte: #f1e7db; --doux: #b3a293; --trait: #3b332d;
      --accent: #f08a5b; --accent-pale: #4a3022; --soleil: #f0b55a; --soleil-pale: #4a3a1e;
      --mer: #6cc3bb; --mer-pale: #1d3634;
      --ombre: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 40px; background: var(--fond); color: var(--texte);
         font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; line-height: 1.45; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  header { padding: 0 6px; }
  .bonjour { margin: 0; color: var(--doux); }
  h1 { margin: 2px 0 0; font-size: 1.8rem; }
  .carte { padding: 18px 20px; border-radius: 22px; background: var(--carte); box-shadow: var(--ombre); }
  label { display: block; margin-bottom: 8px; color: var(--doux); font-size: .92rem; }
  textarea { width: 100%; min-height: 130px; padding: 12px 14px; border: 1px solid var(--trait); border-radius: 16px;
             background: var(--fond); color: var(--texte); font: inherit; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { width: 100%; min-height: 50px; margin-top: 12px; border: 0; border-radius: 16px; background: var(--mer);
           color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--texte); outline-offset: 2px; }
  .verdict { border-left: 6px solid var(--couleur); }
  .verdict[hidden] { display: none; }
  .verdict h2 { margin: 0; font-size: 1.6rem; color: var(--couleur); }
  .arnaque { --couleur: var(--accent); }
  .mefiance { --couleur: var(--soleil); }
  .rien { --couleur: var(--mer); }
  .phrase { margin: 6px 0 0; }
  ul { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 6px; }
  .mots { margin: 10px 0 0; color: var(--doux); font-size: .88rem; }
  .conseil { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--fond); font-size: .92rem; }
  .pied { margin: 0 6px; color: var(--doux); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <p class="bonjour">Un doute sur un SMS ou un message WhatsApp ?</p>
    <h1>Arnaque ou pas ?</h1>
  </header>

  <section class="carte">
    <label for="texte">Colle le message reçu</label>
    <textarea id="texte" maxlength="2000" placeholder="Ex. : Bonjour, ici le service client. Votre compte sera bloqué…"></textarea>
    <button type="button" id="verifier">Vérifier</button>
  </section>

  <section class="carte verdict" id="verdict" hidden aria-live="polite">
    <h2 id="titre"></h2>
    <p class="phrase" id="phrase"></p>
    <ul id="raisons"></ul>
    <p class="mots" id="mots"></p>
    <p class="conseil" id="conseil"></p>
  </section>

  <p class="pied">Le message est analysé sur ton ordinateur : rien n'est envoyé sur internet, rien n'est enregistré.
    Le détecteur peut se tromper : en cas de doute, appelle toi-même le numéro officiel.</p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const PHRASES = {
    arnaque: "Ce message ressemble fortement à une arnaque.",
    mefiance: "Quelques éléments sont suspects. Vérifie avant de faire quoi que ce soit.",
    rien: "Rien de suspect n'a été repéré dans ce message.",
  };
  const CONSEILS = {
    arnaque: "Ne réponds pas, ne clique sur aucun lien, n'envoie ni argent ni code. Tu peux bloquer le numéro.",
    mefiance: "Ne donne aucun code et n'envoie pas d'argent. Contacte la personne ou le service par un autre moyen pour vérifier.",
    rien: "Reste prudent : jamais personne de sérieux ne te demandera ton code secret.",
  };

  async function verifier() {
    const texte = $("texte").value.trim();
    if (!texte) { $("texte").focus(); return; }
    const r = await fetch("/analyser", { method: "POST", headers: { "Content-Type": "application/json", "X-Tableau": "1" },
                                          body: JSON.stringify({ texte }) });
    const v = await r.json();
    const carte = $("verdict");
    carte.hidden = false;
    if (v.erreur) { carte.className = "carte verdict mefiance"; $("titre").textContent = "Impossible d'analyser"; $("phrase").textContent = v.erreur; return; }
    carte.className = "carte verdict " + v.niveau;
    $("titre").textContent = v.titre;
    $("phrase").textContent = PHRASES[v.niveau];
    // Les raisons et les mots viennent du serveur : insérés comme texte, jamais comme HTML.
    $("raisons").replaceChildren(...v.raisons.map((t) => Object.assign(document.createElement("li"), { textContent: t })));
    $("mots").textContent = v.mots.length ? `Mots souvent vus dans les arnaques : ${v.mots.join(", ")}.` : "";
    $("conseil").textContent = CONSEILS[v.niveau];
  }
  $("verifier").addEventListener("click", verifier);
  $("texte").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) verifier(); });
</script>
</body>
</html>
